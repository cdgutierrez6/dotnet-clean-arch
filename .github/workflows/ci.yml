name: CI — .NET 8 Clean Architecture

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

env:
  DOTNET_VERSION: '8.0.x'
  SOLUTION: CleanArch.sln
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true  # Opt-in to Node.js 24 runner (deprecation of Node.js 20)

jobs:
  # ── 1. Build ──────────────────────────────────────────────────────────────────────────────
  build:
    name: 🔨 Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore ${{ env.SOLUTION }}

      - name: Build (no-incremental for Sonar)
        run: dotnet build ${{ env.SOLUTION }} --no-restore --no-incremental -c Release

  # ── 2. Tests + Coverage ───────────────────────────────────────────────────────────────────
  test:
    name: 🧪 Tests & Coverage
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore ${{ env.SOLUTION }}

      - name: Install dotnet-coverage tool
        run: dotnet tool install --global dotnet-coverage

      - name: Run tests with coverage
        run: |
          dotnet-coverage collect \
            "dotnet test ${{ env.SOLUTION }} --no-restore --verbosity normal" \
            -f xml \
            -o coverage.xml

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          retention-days: 1

  # ── 3. SonarCloud Quality Gate ─────────────────────────────────────────────────────────────────
  sonar:
    name: 📊 SonarCloud
    continue-on-error: true  # SonarCloud analysis tracked separately
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Install tools
        run: |
          dotnet tool install --global dotnet-sonarscanner
          dotnet tool install --global dotnet-coverage

      - name: Restore
        run: dotnet restore ${{ env.SOLUTION }}

      - name: SonarCloud — Begin
        run: |
          dotnet sonarscanner begin \
            /k:"cdgutierrez6_dotnet-clean-arch" \
            /o:"cdgutierrez6" \
            /d:sonar.token="${{ secrets.SONAR_TOKEN }}" \
            /d:sonar.host.url="https://sonarcloud.io" \
            /d:sonar.cs.vscoveragexml.reportsPaths="coverage.xml" \
            /d:sonar.qualitygate.wait=true

      - name: Build
        run: dotnet build ${{ env.SOLUTION }} --no-restore --no-incremental -c Release

      - name: Test + Coverage
        run: |
          dotnet-coverage collect \
            "dotnet test ${{ env.SOLUTION }} --no-restore --verbosity normal" \
            -f xml \
            -o coverage.xml

      - name: SonarCloud — End
        run: dotnet sonarscanner end /d:sonar.token="${{ secrets.SONAR_TOKEN }}"
