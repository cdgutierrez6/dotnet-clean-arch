sonar.projectKey=cdgutierrez6_dotnet-clean-arch
sonar.projectName=.NET 8 Clean Architecture
sonar.projectVersion=1.0

sonar.sources=src
sonar.tests=tests
sonar.language=cs
sonar.sourceEncoding=UTF-8

# Coverage report generated by: dotnet test --collect:"XPlat Code Coverage"
# Convert with: reportgenerator -reports:**/coverage.cobertura.xml -targetdir:coverage -reporttypes:SonarQube
sonar.cs.opencover.reportsPaths=coverage/**/coverage.opencover.xml
sonar.cs.vstest.reportsPaths=coverage/**/*.trx

sonar.coverage.exclusions=**/Migrations/**,**/Program.cs,**/*DependencyInjection.cs
sonar.cpd.exclusions=tests/**
